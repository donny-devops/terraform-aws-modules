name: Terraform Deployment (AWS OIDC)

on:
  pull_request:
    branches: [main]
    paths:
      - "environments/**"
      - "modules/**"
  push:
    branches: [main]
    paths:
      - "environments/**"
      - "modules/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod
      action:
        description: "Action to execute"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply

permissions:
  id-token: write   # Required for requesting the JWT from GitHub OIDC provider
  contents: read    # Required for actions/checkout
  pull-requests: write # Required for posting plan comments to PRs

jobs:
  plan-pr:
    name: Terraform Plan (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, prod]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform Init & Plan
        id: plan
        run: |
          cd environments/${{ matrix.environment }}
          terraform init
          
          # Run plan with detailed exitcode
          set +e
          terraform plan -no-color -out=tfplan > plan_output.txt 2>&1
          PLAN_EXIT_CODE=$?
          set -e
          
          echo "exit_code=$PLAN_EXIT_CODE" >> $GITHUB_OUTPUT
          
          # Truncate plan output for PR comment if very long
          PLAN_SUMMARY=$(tail -n 100 plan_output.txt)
          {
            echo "summary<<EOF"
            echo "$PLAN_SUMMARY"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Post Plan Comment on Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Plan: \`environments/${{ matrix.environment }}\`
            *Pushed by: @${{ github.actor }}*
            *Workflow: \`${{ github.workflow }}\`*

            \`\`\`terraform
            ${{ steps.plan.outputs.summary }}
            \`\`\`
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  apply-dev:
    name: Apply Development (Main Push)
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev' && github.event.inputs.action == 'apply')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform Apply Dev
        run: |
          cd environments/dev
          terraform init
          terraform apply -auto-approve

  apply-prod:
    name: Apply Production (Manual Approval / Dispatch)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod' && github.event.inputs.action == 'apply'
    runs-on: ubuntu-latest
    environment: production # Uses GitHub Environment protection rules (manual approvals)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform Apply Prod
        run: |
          cd environments/prod
          terraform init
          terraform apply -auto-approve
